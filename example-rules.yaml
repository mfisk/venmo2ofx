# Example rules file (no personal information)
# See RULES.md for full documentation.

source_accounts:
  - account: Assets:Checking
    mask: '1234'
    institution: Example Bank
    account_type: checking
  - account: Assets:Savings
    mask: '5678'
    institution: Example Bank
    account_type: savings
  - account: Credit:Card
    mask: '9999'
    institution: Example Bank
    account_type: credit

rules:
  # Source grouping: children inherit the source
  - source: Assets:Checking
    rules:
      # Bare string shorthand for if: desc
      - if: EMPLOYER PAYROLL
        then: Income:Salary

      # Dict filters (ANDed)
      - if:
          desc: GROCERY STORE
          mcc: ['5411']
        then: Expenses:Groceries

      # Amount filter (signed: negative = out, positive = in)
      - if:
          desc: INTEREST
          amount: ">0"
        then: Income:Interest

      # Checknum with payee replacement
      - if:
          checks:
            'Landlord LLC': ['101', '102']
        then: Expenses:Rent

  - source: Credit:Card
    rules:
      # MCC-only rule (no desc pattern)
      - if:
          mcc: ['5812', '5813']
        then: Expenses:Dining

      # PFC rule
      - if:
          pfc: [TRANSPORTATION_GAS]
        then: Expenses:Gas

  # Offsets: conditional double-entry transactions in then:
  - source: Assets:Checking
    rules:
      - if: PAYROLL
        then:
          account: Expenses:Payroll
          offsets:
            - if:
                memo_regex: 'Bonus\s+\$([\d,]+\.?\d*)'
              debit: Assets:Bonus
              credit: Expenses:Payroll:Bonus
              describe_as: 'Bonus for {payee}'

  # FITID: exact transaction ID (cannot combine with other filters)
  - source: Assets:Checking
    rules:
      - if:
          fitid: 'abc123def456'
        then: Expenses:OneOff
